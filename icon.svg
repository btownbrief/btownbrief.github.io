<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0d1b2a"/>
  <!-- arcade screen glow -->
  <rect x="20" y="20" width="60" height="46" rx="8" fill="#123a5e" stroke="#4cc3ff" stroke-width="2"/>
  <!-- pixel "B" on the screen -->
  <g fill="#ffd23f">
    <rect x="34" y="30" width="7" height="26"/>
    <rect x="41" y="30" width="13" height="7"/>
    <rect x="41" y="40" width="12" height="6"/>
    <rect x="41" y="49" width="13" height="7"/>
    <rect x="52" y="32" width="6" height="8"/>
    <rect x="52" y="47" width="6" height="8"/>
  </g>
  <!-- coin slot / joystick base -->
  <rect x="30" y="72" width="40" height="6" rx="3" fill="#22405f"/>
  <!-- joystick -->
  <rect x="47" y="66" width="6" height="12" rx="3" fill="#9db4d0"/>
  <circle cx="50" cy="64" r="7" fill="#ff5a3c"/>
  <!-- two buttons -->
  <circle cx="66" cy="84" r="5" fill="#37d67a"/>
  <circle cx="78" cy="82" r="4" fill="#ffd23f"/>
</svg>
